name: Earnings Pipeline Regression Checks

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earnings-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Check source parsing and chart publication
        run: bash scripts/check_earnings_pipeline.sh
