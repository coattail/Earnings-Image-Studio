name: Update Earnings Data

on:
  schedule:
    # All issuers, all markets, all months. Off-hour five-minute polling.
    # GitHub schedules are best-effort; failures remain visible and retriable.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "选择手动更新模式"
        required: true
        default: detect-and-refresh
        type: choice
        options:
          - detect-and-refresh
          - force-refresh
      companies:
        description: "可选：只更新指定公司，逗号分隔，如 nvda,aapl,googl"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write

concurrency:
  group: earnings-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check complete chart publication rules
        run: |
          python -m unittest discover -s tests -p 'test_release_chart_quality.py'
          node --test tests/test_release_chart_render.cjs

      - name: Restore fair retry order
        uses: actions/cache/restore@v4
        with:
          path: output/earnings-watch-state.json
          key: earnings-watch-state-${{ github.run_id }}
          restore-keys: earnings-watch-state-

      - name: Refresh earnings data
        id: refresh
        continue-on-error: true
        shell: bash
        env:
          COMPANIES_INPUT: ${{ inputs.companies }}
          MODE_INPUT: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$MODE_INPUT" == "force-refresh" ]]; then
            cmd=(python scripts/build_dataset.py --refresh)
          else
            cmd=(python scripts/watch_earnings.py --report-path output/update-report.json --budget-seconds 660)
          fi
          if [[ -n "$COMPANIES_INPUT" ]]; then
            cmd+=(--companies "$COMPANIES_INPUT")
          fi

          printf '[workflow] running:'
          printf ' %q' "${cmd[@]}"
          printf '\n'
          "${cmd[@]}"

      - name: Save fair retry order
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/earnings-watch-state.json
          key: earnings-watch-state-${{ github.run_id }}

      - name: Upload update diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: earnings-update-report-${{ github.run_id }}
          path: output/update-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Detect repository changes
        id: changes
        run: |
          # A failed force rebuild must never publish partially written data.
          publishable=$(python -c 'import json,pathlib; p=pathlib.Path("output/update-report.json"); print(bool(json.loads(p.read_text()).get("updatedCompanies")) if p.exists() else "${{ steps.refresh.outcome }}" == "success")')
          if [[ "$publishable" != "True" ]] || git diff --quiet -- data/earnings-dataset.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/earnings-dataset.json data/dataset-index.json data/cache/*.json
          git commit -m "chore: refresh earnings data"

      - name: Push refreshed data
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push
          # GITHUB_TOKEN pushes do not trigger the push deployment workflow.
          gh workflow run deploy-pages.yml --ref main

      - name: Surface incomplete checks and refreshes
        if: always()
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
        run: |
          python scripts/report_earnings_watch.py output/update-report.json
          test "$REFRESH_OUTCOME" = "success"
