name: Update Earnings Data

on:
  schedule:
    # Avoid the top of the hour because GitHub documents higher schedule delays
    # there. During earnings-heavy months, poll hourly from 16:17 through 21:17
    # New York time; use one daily poll in the remaining months.
    - cron: "17 16-21 * 1,2,4,5,7,8,10,11 1-5"
      timezone: "America/New_York"
    - cron: "17 17 * 3,6,9,12 1-5"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      mode:
        description: "选择手动更新模式"
        required: true
        default: detect-and-refresh
        type: choice
        options:
          - detect-and-refresh
          - force-refresh
      companies:
        description: "可选：只更新指定公司，逗号分隔，如 nvda,aapl,googl"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: earnings-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh earnings data
        shell: bash
        run: |
          set -euo pipefail
          companies_input="${{ github.event.inputs.companies || '' }}"
          mode_input="${{ github.event.inputs.mode || 'detect-and-refresh' }}"
          scheduled_update_limit="0"

          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            mode_input="detect-and-refresh"
            # A full official-filings refresh can take several minutes. Process
            # one company per hourly run so it can use the 30-minute per-company
            # budget while remaining below the 45-minute job timeout.
            scheduled_update_limit="1"
          fi

          if [[ "$mode_input" == "force-refresh" ]]; then
            cmd=(python scripts/build_dataset.py --refresh)
          else
            cmd=(python scripts/check_for_updates.py --report-path output/update-report.json --fail-on-check-errors)
          fi

          if [[ -n "$companies_input" ]]; then
            cmd+=(--companies "$companies_input")
          fi

          if [[ "$scheduled_update_limit" != "0" ]]; then
            cmd+=(--max-updates "$scheduled_update_limit")
          fi

          printf '[workflow] running:'
          printf ' %q' "${cmd[@]}"
          printf '\n'
          "${cmd[@]}"

      - name: Upload update diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: earnings-update-report-${{ github.run_id }}
          path: output/update-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Detect repository changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: refresh earnings data"

      - name: Push refreshed data
        if: steps.changes.outputs.changed == 'true'
        run: git push
